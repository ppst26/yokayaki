name: CI

on:
  push:
    branches: [main, security-hardening]
  pull_request:
    branches: [main, security-hardening]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-typecheck-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # เวอร์ชัน pnpm อ่านจาก packageManager ใน package.json — ระบุซ้ำที่นี่ action จะ error
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Unit tests
        run: pnpm test:unit

      - name: Lint
        run: pnpm lint

      - name: Build (includes TypeScript check)
        run: pnpm build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
          SUPABASE_SERVICE_ROLE_KEY: placeholder-service-role
          SUPABASE_JWT_SECRET: placeholder-jwt-secret-min-32-chars-long

  db-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # เวอร์ชัน pnpm อ่านจาก packageManager ใน package.json — ระบุซ้ำที่นี่ action จะ error
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Start Postgres + run migrations
        run: pnpm db:up

      - name: Integration tests (SQL)
        run: pnpm db:test

  e2e:
    runs-on: ubuntu-latest
    needs: lint-typecheck-build
    steps:
      - uses: actions/checkout@v4

      # เวอร์ชัน pnpm อ่านจาก packageManager ใน package.json — ระบุซ้ำที่นี่ action จะ error
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install chromium --with-deps

      - name: Build for E2E
        run: pnpm build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://placeholder.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'placeholder-anon-key' }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || 'placeholder-service-role' }}
          SUPABASE_JWT_SECRET: ${{ secrets.SUPABASE_JWT_SECRET || 'placeholder-jwt-secret-min-32-chars-long' }}
          SUPABASE_JWT_SIGNING_JWK: ${{ secrets.SUPABASE_JWT_SIGNING_JWK }}

      - name: E2E (smoke + full flow when Supabase secrets set)
        run: pnpm test:e2e
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://placeholder.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'placeholder-anon-key' }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || 'placeholder-service-role' }}
          SUPABASE_JWT_SECRET: ${{ secrets.SUPABASE_JWT_SECRET || 'placeholder-jwt-secret-min-32-chars-long' }}
          SUPABASE_JWT_SIGNING_JWK: ${{ secrets.SUPABASE_JWT_SIGNING_JWK }}
          E2E_STAFF_PIN: ${{ secrets.E2E_STAFF_PIN || '111111' }}
